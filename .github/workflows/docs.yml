name: Publish Docs

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Generate Dokka HTML
        run: ./gradlew GoogleSignInComposeLibrary:dokkaGenerateHtml
      - uses: actions/upload-pages-artifact@v3
        with:
          path: GoogleSignInComposeLibrary/build/dokkaDir
      - id: deployment
        uses: actions/deploy-pages@v4
